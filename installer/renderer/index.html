<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LOCI Engine Setup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>LOCI Engine Setup</h1>

  <section id="step-detect" class="step">
    <h2>1. Environment</h2>
    <pre id="detect-output">Detecting...</pre>
    <button id="btn-detect-next" disabled>Next</button>
  </section>

  <section id="step-choose" class="step" hidden>
    <h2>2. Choose locations</h2>

    <div class="field">
      <label>Claude Code auto-memory directory (where recall.py and the hook script live)</label>
      <select id="memory-dir-select"></select>
      <button id="btn-browse-memory">Browse for another...</button>
      <p id="memory-dir-chosen" class="chosen"></p>
    </div>

    <div class="field">
      <label>Project directory (where .claude/settings.local.json gets the PostCompact hook)</label>
      <button id="btn-browse-project">Choose project folder...</button>
      <p id="project-dir-chosen" class="chosen"></p>
    </div>

    <button id="btn-choose-next" disabled>Install</button>
  </section>

  <section id="step-install" class="step" hidden>
    <h2>3. Installing</h2>
    <pre id="install-output"></pre>
  </section>

  <section id="step-done" class="step" hidden>
    <h2>Done</h2>
    <p id="done-summary"></p>
  </section>

  <script src="renderer.js"></script>
</body>
</html>
