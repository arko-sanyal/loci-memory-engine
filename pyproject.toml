[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
description = "Local, offline RAG pipeline with a heat-tiered LOCI memory engine (Ollama + sqlite-vec + FTS5)"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "httpx>=0.27.0",
    "sqlite-vec>=0.1.9",
    "pypdf>=5.0.0",
    "langchain-core>=1.6.2",
    "langchain-text-splitters>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
loci-engine-mcp = "loci_engine.mcp_server:main"

[tool.setuptools.packages.find]
where = [".", "loci-engine"]
include = ["rag*", "loci_engine*"]

[tool.setuptools.package-data]
loci_engine = ["schema.sql"]
