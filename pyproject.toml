[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
description = "Local, offline RAG pipeline over documents using Ollama and Chroma"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "httpx>=0.27.0",
    "chromadb>=1.5.9",
    "pypdf>=5.0.0",
    "langchain-core>=1.6.2",
    "langchain-text-splitters>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["rag*"]
